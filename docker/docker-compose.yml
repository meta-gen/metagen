services:
  meta-gen-postgres:
    image: postgres:18.6
    restart: always
    environment:
      POSTGRES_PASSWORD: meta-gen
      POSTGRES_DB: meta-gen
      POSTGRES_USER: meta-gen
    ports:
      - 15439:5432
    volumes:
      - ./volume/metagen:/var/lib/postgresql
    container_name: meta-gen-postgres
    networks:
      - meta-network

networks:
  meta-network:
    driver: bridge
