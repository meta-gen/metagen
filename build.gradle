import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

// 모든 모듈 공통 설정
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    // Boot 플러그인은 app 모듈에만 적용하고, 나머지 모듈은 Boot BOM 으로 버전만 맞춘다
    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // 엔티티가 있는 모듈마다 자기 Q클래스를 생성한다 (다른 모듈의 Q클래스는 의존 jar 에서 참조)
        annotationProcessor variantOf(libs.querydsl.apt) { classifier('jpa') }
        annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
        annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation'
    }

    tasks.named('test') {
        useJUnitPlatform()
        // 루트에서 --tests 로 단일 테스트를 지정해도 해당 테스트가 없는 모듈이 실패하지 않도록
        filter.failOnNoMatchingTests = false
    }
}

// 메뉴 모듈 공통 : core(인증/프로젝트) 위에 올라가고, 테스트는 core 픽스처를 사용한다
configure(subprojects.findAll { it.name in ['metagen-system', 'metagen-operation', 'metagen-data', 'metagen-design', 'metagen-chat'] }) {
    dependencies {
        api project(':metagen-core')
        testImplementation testFixtures(project(':metagen-core'))
    }
}
