// 실행 모듈 - 메뉴 모듈을 조립하고 실행 jar(build/libs/metagen.jar)를 만든다
plugins {
    id 'org.springframework.boot'   // 버전은 루트 plugins 블록(libs.versions.toml)에서 지정
}

dependencies {
    implementation project(':metagen-system')
    implementation project(':metagen-operation')
    implementation project(':metagen-data')
    implementation project(':metagen-design')
    implementation project(':metagen-chat')

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
    // Boot 4는 모듈화되어 flyway-core만으로는 자동 설정이 동작하지 않는다 (누락 시 마이그레이션이 오류 없이 실행되지 않음)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    // H2 콘솔(/h2-console)은 Boot 4에서 별도 모듈 (h2-local에서만 활성화)
    runtimeOnly 'org.springframework.boot:spring-boot-h2console'

    testImplementation testFixtures(project(':metagen-core'))
    testImplementation 'org.springframework.security:spring-security-test'
    // SmokeTest 의 STOMP 클라이언트
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket'
}

bootJar {
    archiveFileName = 'metagen.jar'
}

jar {
    enabled = false
}
