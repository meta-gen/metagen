<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <link rel="stylesheet" th:href="@{/css/system/project_manage.css}">
    <script type="module" th:src="@{/js/system/project/project_manage.js}"></script>
</head>

<body>
<section layout:fragment="content">
    <div th:replace="~{fragments/page_header :: pageHeader('시스템 관리', '프로젝트 관리')}"></div>
    <p class="page-desc">프로젝트를 등록·수정하고, 프로젝트 멤버의 참여를 승인합니다.</p>

    <!-- 프로젝트 선택 바 (GitHub 저장소 헤더 형태) -->
    <div class="project-bar">
        <div class="project-bar-main">
            <svg class="project-bar-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/></svg>
            <label for="projectSelector" class="visually-hidden">프로젝트 선택</label>
            <select id="projectSelector" class="project-select">
                <option th:each="project : ${projects}"
                        th:value="${project.id}"
                        th:data-active="${project.isActive}"
                        th:text="${project.projectName}"
                        th:data-autoactive="${project.isAutoActive}">
                </option>
            </select>
            <span id="projectStatusLabel" class="gh-label gh-label-dot"></span>
            <span id="projectAutoActiveLabel" class="gh-label" style="display: none;">사용자 자동 승인</span>
        </div>
    </div>

    <!-- 프로젝트 버튼 : 그리드 툴바 버튼 그룹 앞으로 이동 -->
    <div class="grid-extra-actions" data-grid-actions="projectMemberGrid">
        <button id="btn-project-add" class="btn">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg>
            프로젝트 등록
        </button>
        <button id="btn-project-edit" class="btn">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61Zm.176 4.823L9.75 4.81l-6.286 6.287a.253.253 0 0 0-.064.108l-.558 1.953 1.953-.558a.253.253 0 0 0 .108-.064Zm1.238-3.763a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354Z"/></svg>
            프로젝트 수정
        </button>
        <button id="btn-project-delete" class="btn btn-danger">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 1.75V3h2.25a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1 0-1.5H5V1.75C5 .784 5.784 0 6.75 0h2.5C10.216 0 11 .784 11 1.75ZM4.496 6.675l.66 6.6a.25.25 0 0 0 .249.225h5.19a.25.25 0 0 0 .249-.225l.66-6.6a.75.75 0 0 1 1.492.149l-.66 6.6A1.748 1.748 0 0 1 10.595 15h-5.19a1.75 1.75 0 0 1-1.741-1.575l-.66-6.6a.75.75 0 1 1 1.492-.15ZM6.5 1.75V3h3V1.75a.25.25 0 0 0-.25-.25h-2.5a.25.25 0 0 0-.25.25Z"/></svg>
            프로젝트 삭제
        </button>
    </div>



    <!-- 그리드 영역 -->
    <div id="gridContainer">
        <div th:replace="~{fragments/grid :: grid('projectMemberGrid', '/api/getProject/' + ${projects[0].id}, ${crudActions}, null)}"></div>
    </div>

</section>
</body>
</html>
