<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <script type="module" th:src="@{/js/system/log/system_log.js}"></script>
</head>
<body>
<section layout:fragment="content">
    <div th:replace="~{fragments/page_header :: pageHeader('시스템 관리', '시스템 로그')}"></div>
    <p class="page-desc">프로젝트에서 발생한 요청 이력을 조회합니다. 상세보기에서 요청/응답 데이터를 확인할 수 있습니다.</p>

    <!-- 그리드 영역 -->
    <div id="gridContainer">
        <div th:replace="~{fragments/grid :: grid('logTable', '/api/getSystemLog', '', null)}"></div>
    </div>
</section>
</body>
</html>
