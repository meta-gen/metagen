<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	layout:decorate="~{layout}">

<head>
	<link rel="stylesheet" th:href="@{/css/operation/help.css}">
	<script type="module" th:src="@{/js/operation/help.js}"></script>
</head>

<body>
	<section layout:fragment="content">
		<div th:replace="~{fragments/page_header :: pageHeader('운영 관리', '도움말')}"></div>
		<p class="page-desc">자주 묻는 질문을 분류별로 확인하거나 검색할 수 있습니다.</p>

		<!-- 검색 -->
		<form id="faq-form" class="faq-search" role="search">
			<label for="faq-search" class="visually-hidden">질문 검색</label>
			<input id="faq-search" type="search" class="form-control" placeholder="질문 또는 답변 검색" autocomplete="off"/>
			<button type="submit" class="btn" id="faq-search-btn">검색</button>
		</form>

		<!-- 분류 탭 (Primer UnderlineNav) -->
		<ul class="nav nav-tabs" id="faqTabMenu" role="tablist"></ul>

		<!-- 질문 목록 -->
		<div id="faqTabContent" class="faq-content"></div>
	</section>
</body>

</html>
