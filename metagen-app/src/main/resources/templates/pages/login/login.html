<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
>
<head>
    <link rel="stylesheet" th:href="@{/css/login/auth.css}">
    <script type="module" th:src="@{/js/login/login.js}"></script>
</head>

<body>
<section layout:fragment="content">
    <!-- GitHub 로그인 화면 형태 : 로고 / 제목 / 폼 박스 / 회원가입 안내 -->
    <div class="auth">
        <div class="auth-logo">
            <img th:src="@{/images/favicon.png}" src="/images/favicon.png" alt="" width="48" height="48">
        </div>
        <h1 class="auth-title">MetaGen 로그인</h1>

        <input type="hidden" id="errorMessage" th:value="${exception} ?: '잘못된 아이디나 암호입니다'">

        <div th:if="${param.error}">
            <script>
                const errorMessage = document.getElementById('errorMessage')?.value || '잘못된 아이디나 암호입니다.';
                // 새로고침 없이 URL만 정리하여 입력 내역 유지
                openAlert(errorMessage, () => {history.replaceState(null, "", "/login")});
            </script>
        </div>

        <div class="auth-box">
            <form id="loginForm" th:action="@{/login}" method="post" onsubmit="return beforeLogin()">
                <div class="auth-field">
                    <label for="username">아이디</label>
                    <input type="text" class="form-control" id="username" name="username"
                           autocomplete="username" autocapitalize="off" autofocus required>
                </div>

                <!-- 프로젝트 ID를 저장할 hidden 필드 -->
                <input type="hidden" id="project_id" name="project_id" value="">

                <div class="auth-field">
                    <label for="password">비밀번호</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>

                <!-- 아이디/비밀번호 확인 후 프로젝트를 선택하면 바로 로그인 (login.js) -->
                <button type="submit" id="project-btn" class="btn btn-primary auth-submit">로그인</button>
                <p class="auth-hint">로그인할 프로젝트는 다음 단계에서 선택합니다.</p>
            </form>
        </div>

        <div class="auth-callout">
            MetaGen이 처음이신가요? <a th:href="@{/signup}" href="/signup">회원가입</a>
        </div>
    </div>
</section>

</body>
</html>
