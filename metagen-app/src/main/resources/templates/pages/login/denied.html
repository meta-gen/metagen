<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <link rel="stylesheet" th:href="@{/css/login/denied.css}">
</head>
<body>
<section layout:fragment="content">
    <!-- GitHub 오류 화면 형태 (Blankslate) -->
    <div class="denied">
        <div class="denied-icon">
            <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M12 1c1.176 0 2.248.384 3.108 1.03l-.003.002 5.063 3.613c.524.375.832.98.832 1.623v6.3c0 3.08-1.62 5.93-4.26 7.5l-3.7 2.2a1.75 1.75 0 0 1-1.79 0l-3.7-2.2A8.744 8.744 0 0 1 3.29 13.57V7.268c0-.643.308-1.248.832-1.623l5.063-3.613-.003-.002A5.28 5.28 0 0 1 12 1Zm-6.62 6.022a.25.25 0 0 0-.105.203v6.344a7.24 7.24 0 0 0 3.528 6.208l3.7 2.2a.25.25 0 0 0 .255 0l3.7-2.2a7.24 7.24 0 0 0 3.528-6.208V7.225a.25.25 0 0 0-.105-.203l-5.063-3.614a3.75 3.75 0 0 0-4.326 0ZM12 7.5a2.5 2.5 0 0 1 1.25 4.665v2.085a1.25 1.25 0 0 1-2.5 0v-2.085A2.5 2.5 0 0 1 12 7.5Z"/></svg>
        </div>

        <h1 class="denied-title" th:text="${exception} ?: '접근이 거부되었습니다.'">접근이 거부되었습니다.</h1>

        <p class="denied-desc" th:if="${msg}" th:text="${name} + ' 님은 ' + ${msg}"></p>
        <p class="denied-desc" th:if="${name != null and msg == null}"
           th:text="${name} + ' 님은 해당 페이지에 접근 권한이 없습니다. 관리자에게 접근권한을 신청하시기 바랍니다.'"></p>
        <p class="denied-desc" th:if="${name == null}">비정상적인 접근입니다.</p>

        <div class="denied-actions">
            <a href="/" class="btn btn-primary">홈으로 돌아가기</a>
            <button type="button" class="btn" onclick="history.back()">이전 화면</button>
        </div>
    </div>
</section>
</body>
</html>
