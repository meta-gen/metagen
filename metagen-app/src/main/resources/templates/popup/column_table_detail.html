<!DOCTYPE html>
<!-- 팝업 다이얼로그(#popupDialog) 화면 조각 : PopupController 가 "popup/column_table_detail :: content" 로 반환한다. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="popup-container">
    <div class="popup-header">
        <p>
            화살표 버튼으로 컬럼 순서를 바꾼 뒤 순서저장을 누르면 반영됩니다.
        </p>
    </div>
    <div class="button-container" style="justify-content:flex-end; display: flex;">
        <button class="btn btn-primary" id="save-sort-order">순서저장</button>
    </div>

    <div id="column-table-container"></div>
</div>
</body>
</html>
