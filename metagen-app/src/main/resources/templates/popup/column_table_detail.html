<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>MetaGen</title>
    <!-- 폰트 미리 받기 : 첫 렌더링 전에 Pretendard 를 준비해 폰트 교체로 인한 화면 흔들림 방지 -->
    <link rel="preload" th:href="@{/fonts/pretendard/PretendardVariable.woff2}" href="/fonts/pretendard/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/dataTables.dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/js/jquery-ui-1.14.1.custom/jquery-ui.css}">
    <link rel="stylesheet" th:href="@{/css/popup.css}">

    <script th:src="@{/js/jquery-3.6.0.min.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.js}"></script>
    <script th:src="@{/js/dataTables.min.js}"></script>
    <script th:src="@{/js/jquery-ui-1.14.1.custom/jquery-ui.js}"></script>
    <script type="module" th:src="@{/js/popup/column_table_detail.js}"></script>

    <link th:href="@{/fonts/pretendard.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/primer.css}">
    <link rel="stylesheet" th:href="@{/css/data/column_table_detail.css}">
</head>

<body>
<div class="popup-container">
    <div class="popup-header">
        <h1 id="table-name"></h1>
        <p>
            조회조건을 기준으로 승인완료된 테이블 정보를 조회합니다.
        </p>
    </div>
    <div class="button-container" style="justify-content:flex-end; display: flex;">
        <button class="btn btn-primary" id="save-sort-order">순서저장</button>
    </div>

    <div id="column-table-container"></div>
</div>
</body>
</html>
