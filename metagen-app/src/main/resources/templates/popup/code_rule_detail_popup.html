<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MetaGen</title>
    <!-- 폰트 미리 받기 : 첫 렌더링 전에 Pretendard 를 준비해 폰트 교체로 인한 화면 흔들림 방지 -->
    <link rel="preload" th:href="@{/fonts/pretendard/PretendardVariable.woff2}" href="/fonts/pretendard/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/popup.css}">

    <script th:src="@{/js/jquery-3.6.0.min.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.js}"></script>
    <script type="module" th:src="@{/js/popup/code_rule_detail_popup.js}"></script>

    <link th:href="@{/fonts/pretendard.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/primer.css}">
</head>

<body>
<div class="popup-container">
    <div class="popup-header">
        <h1>코드규칙</h1>
        <p>
            코드규칙을 등록/수정합니다.
        </p>
    </div>

    <form class="popup-form">
        <input type="hidden" id="type" />
        <input type="hidden" id="id" />
        <input type="hidden" id="isDicAbbrUsed" />
        <input type="hidden" id="dummyData" />

        <div class="form-group">
            <label for="templateSelect">템플릿 선택</label>
            <select id="templateSelect" class="form-control">
                <option value="">템플릿을 선택하세요</option>
            </select>
        </div>

        <div class="form-group">
            <label for="codeRule">코드규칙 선택</label>
            <select id="codeRule" class="form-control">
                <option value="">코드규칙을 선택하세요</option>
            </select>
        </div>

        <div class="form-group">
            <label for="functionGroup">그룹명</label>
            <input type="text" id="functionGroup" class="form-control" placeholder="예: 회원관리, 게시판, 인증 등 기능 그룹 이름을 입력하세요"/>
        </div>

        <div class="form-group">
            <label for="methodKeyword">명칭 키워드</label>
            <input type="text" id="methodKeyword" class="form-control" placeholder="예: 사용자 아이디 → userId, 주문 내역 조회 → orderHistory (띄어쓰기를 통해 조회를 수행합니다.)"/>
        </div>

        <div class="form-group">
            <label for="methodPurpose">명칭 설명</label>
            <input type="text" id="methodPurpose" class="form-control" placeholder="예: 사용자 아이디 정보를 반환하는 메소드입니다. (미입력 시 명칭 키워드 와 코드규칙의 코드규칙 내용이 입력됩니다.)"/>
        </div>

        <div class="form-group">
            <label for="input">입력값</label>
            <input type="text" id="input" class="form-control" placeholder="선택 사항: 추가일 경우, 기본 입력값이 존재 시 기본입력값이 입력됩니다."/>
        </div>

        <div class="form-group">
            <label for="output">출력값</label>
            <input type="text" id="output" class="form-control" placeholder="선택 사항: 추가일 경우, 기본 출력값이 존재 시 기본출력값이 입력됩니다."/>
        </div>

        <div class="form-group">
            <label for="exception">예외처리</label>
            <input type="text" id="exception" class="form-control" placeholder="선택 사항: 추가일 경우, 기본 예외처리가 존재 시 예외처리가 입력됩니다."/>
        </div>

        <div class="form-group">
            <label for="description">기타 설명</label>
            <input type="text" id="description" class="form-control" placeholder="선택 사항: 코드 규칙에 대한 추가 설명을 입력하세요"/>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="useSwagger">
            <label class="form-check-label" for="useSwagger">Swagger 사용 여부</label>
        </div>
    </form>

    <!-- 변환 : 입력값으로 메소드명/양식을 만든다 -->
    <div class="popup-form code-rule-convert">
        <button type="button" class="btn" id="set-button">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>
            변환
        </button>
        <span class="gh-muted">입력한 내용으로 메소드명과 양식을 만듭니다.</span>
    </div>

    <form class="popup-form code-rule-result">
        <div class="form-group">
            <label for="methodName">변환된 메소드명</label>
            <input type="text" id="methodName" class="form-control gh-method-name" placeholder="변환 버튼을 누르면 생성됩니다." readonly disabled/>
        </div>

        <div class="form-group">
            <label for="methodForm">메소드 양식</label>
            <textarea id="methodForm" class="form-control gh-code-area" rows="7" readonly disabled></textarea>
        </div>

        <!-- 하단 버튼 (저장은 변환 후 노출) -->
        <div class="popup-actions">
            <button type="button" class="btn" onclick="window.close()">닫기</button>
            <button type="button" class="btn btn-primary" id="save-button" style="display: none">저장</button>
        </div>
    </form>
</div>
</body>
</html>
