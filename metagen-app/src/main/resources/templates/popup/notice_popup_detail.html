<!DOCTYPE html>
<!-- 팝업 다이얼로그(#popupDialog) 화면 조각 : PopupController 가 "popup/notice_popup_detail :: content" 로 반환한다. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 공지사항 상세 (GitHub 이슈 화면 형태) -->
<div th:fragment="content" class="popup-container notice-view">
    <header class="notice-view-header">
        <h1 class="notice-view-title" th:text="${notice.title}">공지사항 제목</h1>
        <div class="notice-view-meta">
            <span class="gh-label gh-label-accent gh-label-dot">공지</span>
            <span>
                <strong th:text="${notice.username}">admin</strong>님이
                <time th:if="${notice.updatedTime != null}"
                      th:text="${#temporals.format(notice.updatedTime, 'yyyy-MM-dd HH:mm')}">2025-01-01 10:00</time>에 작성
            </span>
            <span class="notice-view-sep" aria-hidden="true">·</span>
            <span>조회 <span th:text="${notice.accounts.size()}">0</span>명</span>
        </div>
    </header>

    <div class="notice-view-layout">
        <!-- 본문 -->
        <article class="notice-box">
            <div class="notice-box-header">
                <span class="gh-avatar"
                      th:text="${#strings.isEmpty(notice.username) ? '?' : #strings.substring(notice.username, 0, 1)}">a</span>
                <strong th:text="${notice.username}">admin</strong>
                <span class="gh-muted">작성</span>
            </div>
            <div class="notice-box-body" th:text="${notice.content}">공지사항 내용</div>
        </article>

        <!-- 조회자 -->
        <aside class="notice-side">
            <h2 class="notice-side-title">
                조회자 <span class="notice-counter" th:text="${notice.accounts.size()}">0</span>
            </h2>
            <ul class="notice-readers" th:unless="${notice.accounts.isEmpty()}">
                <li th:each="account : ${notice.accounts}" class="gh-user">
                    <span class="gh-avatar"
                          th:text="${#strings.isEmpty(account.name) ? '?' : #strings.substring(account.name, 0, 1)}">a</span>
                    <span class="notice-reader-name" th:text="${account.name}">홍길동</span>
                    <span class="gh-muted" th:text="${account.username}">user</span>
                </li>
            </ul>
            <p class="notice-side-empty" th:if="${notice.accounts.isEmpty()}">아직 조회한 사용자가 없습니다.</p>
        </aside>
    </div>
</div>
</body>
</html>
