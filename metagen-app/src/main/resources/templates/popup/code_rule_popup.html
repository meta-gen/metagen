<!DOCTYPE html>
<!-- 팝업 다이얼로그(#popupDialog) 화면 조각 : PopupController 가 "popup/code_rule_popup :: content" 로 반환한다. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="popup-container">
        <div class="popup-header">
            <p>
                코드규칙을 등록/수정합니다.
            </p>
        </div>

        <form class="popup-form">
            <input type="hidden" id="type" />
            <input type="hidden" id="id" />

            <div class="form-group">
                <label for="templateSelect">등록할 템플릿 선택</label>
                <select id="templateSelect" class="form-control">
                    <option value="">템플릿을 선택하세요</option>
                </select>
            </div>

            <div class="form-group">
                <label for="codeRuleName">코드규칙 명</label>
                <input type="text" id="codeRuleName" class="form-control" />
            </div>

            <div class="form-group">
                <label for="codeRuleDescription">코드규칙 내용</label>
                <input type="text" id="codeRuleDescription" class="form-control" placeholder="${1}을 조회한다. (${1}을 입력 시 코드규칙 명칭 키워드로 치환됩니다.)"/>
            </div>

            <div class="form-group">
                <label for="prefix">접두사</label>
                <input type="text" id="prefix" class="form-control" placeholder="선택 사항: 프로젝트 기본 접두사를 입력하세요."/>
            </div>

            <div class="form-group">
                <label for="suffix">접미사</label>
                <input type="text" id="suffix" class="form-control" placeholder="선택 사항: 프로젝트 기본 접미사를 입력하세요."/>
            </div>

            <div class="form-group">
                <label for="input">기본 입력값</label>
                <input type="text" id="input" class="form-control" placeholder="선택 사항: 함수/메소드의 입력값을 입력하세요."/>
            </div>

            <div class="form-group">
                <label for="output">기본 출력값</label>
                <input type="text" id="output" class="form-control" placeholder="선택 사항: 함수/메소드의 출력값을 입력하세요."/>
            </div>

            <div class="form-group">
                <label for="exception">기본 예외처리값</label>
                <input type="text" id="exception" class="form-control" placeholder="선택 사항: 함수/메소드의 예외처리를 입력하세요."/>
            </div>

            <div class="form-group">
                <label for="methodForm">메소드 형식 예시</label>
                <textarea id="methodForm" class="form-control gh-code-area" style="height: 400px"
                          placeholder='▶ **\${0}** : 메소드 또는 함수 이름이 들어가는 부분입니다.
▶ **\${1}** : 코드 규칙에 따라 작성된 메소드의 간단한 명칭입니다.
▶ **\${2}** : 메소드의 기능 또는 목적에 대한 설명이 들어갑니다.
▶ **\${3}** : 코드규칙에 등록한 기타 설명이 들어갑니다.
▶ **\${INPUT}** : 코드규칙에 등록한 입력값이 들어갑니다.
▶ **\${OUTPUT}** : 코드규칙에 등록한 출력값이 들어갑니다.
▶ **\${EXCEPTION}** : 코드규칙에 등록한 예외처리값이 들어갑니다.
▶ **\${USER_NAME}** : 사용자 명이 입력됩니다.
▶ Operation 어노테이션을 통한 Swagger 설명은 메소드 형식에 직접 입력하지 않아도, 프로젝트 관리 내 Swagger 사용 설정 시 자동으로 적용됩니다.
/**
 * \${2}
 */
@Operation(summary = "\${1}", description = "\${2}")
@GetMapping("")
public ResponseEntity<Map<String, Boolean>> \${0}() {
    return ResponseEntity.ok(Map.of("result", true));
}'></textarea>
            </div>

            <!-- 하단 버튼 -->
            <div class="popup-actions">
                <button type="button" class="btn" data-popup-close>닫기</button>
                <button type="button" class="btn btn-primary" id="save-button">저장</button>
            </div>
        </form>
    </div>
</body>
</html>
