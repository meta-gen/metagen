# 개발 서버
spring:
  datasource:
    url: jdbc:postgresql://meta-gen-postgres:5432/meta-gen?charSet=UTF-8&reWriteBatchedInserts=true
    username: meta-gen
    password: meta-gen
  jpa:
    properties:
      hibernate:
        ejb:
          metamodel:
            population: enabled
          format_sql: true
          jdbc:
            lob:
              non_contextual_creation: true

server:
  port: 18080
