# Docker 이미지 (H2 파일 DB) : /data 볼륨에 저장
spring:
  datasource:
    url: jdbc:h2:file:/data/meta-gen;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: meta-gen
    password: meta-gen
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  # H2 콘솔은 DB 전체에 접근할 수 있으므로 운영 이미지에서는 끈다 (필요 시 SPRING_H2_CONSOLE_ENABLED=true)
  h2:
    console:
      enabled: false
      path: /h2-console
