# 공통 설정 : 프로필별 파일(application-{profile}.yml)에는 DB 연결 등 환경별로 다른 값만 둔다.
spring:
  profiles:
    active: local
    # 개발용 프로필에만 상세 로그(application-debug-log.yml)를 함께 적용한다. Docker(운영) 이미지는 INFO.
    group:
      local: debug-log
      h2-local: debug-log
      dev: debug-log
  application:
    name: meta-gen
  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration/{vendor})가 관리하고, JPA는 엔티티와 스키마 일치 여부만 검증한다
      ddl-auto: validate
    mapping-resources: META-INF/orm.xml
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    # 기존 DB(Hibernate가 생성, flyway_schema_history 없음)는 V1을 baseline으로 간주하고 V2부터 적용
    baseline-on-migrate: true
    baseline-version: 1
  batch:
    jdbc:
      initialize-schema: never # Batch 메타 테이블도 Flyway V1에서 생성
    job:
      enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

# 운영 기본 로그 레벨 : 필요 시 환경변수로 조정 (예: LOGGING_LEVEL_COM_KOBOOLEAN_METAGEN=DEBUG)
logging:
  level:
    root: INFO

server:
  port: 9940
  # 리버스 프록시(nginx 등)의 X-Forwarded-Proto/For 헤더를 반영한다.
  # HTTPS 요청이면 세션 쿠키에 Secure가 자동으로 붙으므로 HTTP/HTTPS 이미지를 나눌 필요가 없다.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        # secure는 지정하지 않는다 : 요청이 HTTPS인 경우에만 Tomcat이 Secure를 붙인다.
        same-site: Lax
      timeout: 30m

# Swagger UI / API 문서는 로컬 프로필(local, h2-local)에서만 활성화
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui
    enabled: false
    url: /v3/api-docs # API 문서 파일 경로 설정
  info:
    title: "MetaGen API 문서"
    description: "MetaGen 프로젝트의 API 문서"
    version: "1.0.0"
