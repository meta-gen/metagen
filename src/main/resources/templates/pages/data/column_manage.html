<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <script type="module" th:src="@{/js/data/column/column_manage.js}"></script>
</head>

<body>
<section layout:fragment="content">
    <div th:replace="~{fragments/page_header :: pageHeader('데이터 관리', '컬럼 관리')}"></div>

    <!-- 상단 버튼 : 그리드 버튼 그룹으로 이동 -->
    <div class="grid-extra-actions" data-grid-actions="columnManageGrid">
        <button class="btn btn-primary" id="download-template">템플릿 다운로드</button>
        <button id="excel-upload" class="btn btn-primary">컬럼 업로드</button>
    </div>

    <input type="file" id="upload-file" style="display: none" accept=".xlsx, .xls"/>

    <!-- 그리드 영역 -->
    <div id="gridContainer">
        <div th:replace="~{fragments/grid :: grid('columnManageGrid', '/api/selectColumn', 'anCD', 'columnManageGrid_selectRow')}"></div>
    </div>

</section>
</body>
